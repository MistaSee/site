<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Caveat:wght@600&family=Space+Grotesk:wght@500;600&display=block">
<style>
:root{--paper:#F6F3EC;--panel:#FFFDF8;--ink:#0F1720;--oxide:#0F766E;--signal:#F05A4A;--signal-deep:#C9392A;--muted:#4A5560;--line:rgba(15,23,32,.12)}
html,body{margin:0;width:600px;height:140px;overflow:hidden;background:var(--paper)}
.b{position:relative;width:600px;height:140px;box-sizing:border-box;padding:12px;
  background:var(--paper) repeating-linear-gradient(transparent 0 27px, rgba(15,23,32,.045) 27px 28px)}
.card{position:relative;height:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 10px 24px rgba(15,23,32,.08);display:flex;align-items:center;gap:16px;padding:0 22px 0 18px}
.mark{width:64px;height:64px;object-fit:contain;flex:none;transform:rotate(-6deg)}
.t{flex:1;min-width:0}
.name{font:700 21px/1 "Azeret Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.role{font:600 15.5px/1.3 "Space Grotesk",sans-serif;color:var(--ink);margin-top:8px}
.role em{font-style:normal;color:var(--oxide);position:relative;white-space:nowrap}
.role em svg{position:absolute;left:-2px;right:-2px;bottom:-6px;width:calc(100% + 4px);height:7px}
.kicker{display:flex;align-items:center;gap:9px;margin-top:12px;font:500 8.6px/1 "Azeret Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--oxide)}
.kicker::before{content:"";width:22px;height:2px;background:currentColor}
.hand{position:absolute;right:20px;top:14px;font:600 21px/1 "Caveat",cursive;color:var(--signal-deep);transform:rotate(-4deg)}
.hand svg{display:block;margin:2px 0 0 30px}
</style></head><body><div class="b"><div class="card">
  <img class="mark" src="https://markcalleja.info/gbc.png" alt="">
  <div class="t">
    <div class="name">Mark Calleja</div>
    <div class="role">Rogue pedagogue &amp; <em>creative technologist<svg viewBox="0 0 160 8" preserveAspectRatio="none"><path d="M1 5 C 30 1, 60 8, 90 4 S 140 2, 159 5" fill="none" stroke="#F05A4A" stroke-width="2.4" stroke-linecap="round"/></svg></em></div>
    <div class="kicker">Constructive chaos, carefully supervised</div>
  </div>
  <div class="hand">markcalleja.info</div>
</div></div></body></html>
